name: Update Profile README Widgets

on:
  schedule:
    - cron: "0 3 * * *"   # jalan otomatis tiap hari jam 03:00 UTC
  workflow_dispatch:        # bisa dijalankan manual dari tab Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-widgets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ---------- GITHUB STATS CARD ----------
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=mzghan&show_icons=true&theme=tokyonight&hide_border=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------- TOP LANGUAGES CARD ----------
      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=mzghan&layout=compact&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------- STREAK STATS ----------
      - name: Generate streak stats
        uses: be-next/github-streak-stats-action@v1
        with:
          username: mzghan
          token: ${{ secrets.GITHUB_TOKEN }}
          output-path: profile/streak.svg
          theme: dark
          hide-border: true

      # ---------- CONTRIBUTION SNAKE ----------
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: mzghan
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark

      # ---------- COMMIT HASIL ----------
      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "chore: update profile widgets"
          git push
